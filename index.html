<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CF Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <div class="container">

    <div class="header">
      <div>
        <div class="brand-mark"><span class="brand-dot"></span> Performance lab / 01</div>
        <h1>CF Analyzer</h1>
        <p class="subtitle">Turn your Codeforces history into a clear, practical plan for your next rating milestone.</p>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch color theme">☼ <span>Theme</span></button>
    </div>

    <div class="input-section">
      <input type="text" id="handleInput" aria-label="Codeforces handle" placeholder="Enter a Codeforces handle" autocomplete="off" />
      <button id="analyzeBtn" onclick="startAnalysis()">Analyze profile <span aria-hidden="true">↗</span></button>
    </div>
    <p class="hint">Press Enter to run · analysis includes solved problems, contests, and code patterns</p>

    <div id="loader" class="hidden">
      <div class="spinner"></div>
      <p id="loaderText">Loading...</p>
    </div>

    <div id="errorBox" class="hidden error-box"></div>

    <div id="results" class="hidden">

      <div class="card" id="userCard"></div>

      <div class="tabs" role="tablist" aria-label="Analysis sections">
        <button class="tab active" role="tab" aria-selected="true" onclick="switchTab(0)">Overview</button>
        <button class="tab" role="tab" aria-selected="false" onclick="switchTab(1)">Topics</button>
        <button class="tab" role="tab" aria-selected="false" onclick="switchTab(2)">Weaknesses</button>
        <button class="tab" role="tab" aria-selected="false" onclick="switchTab(3)">Roadmap</button>
        <button class="tab" role="tab" aria-selected="false" onclick="switchTab(4)">Contests</button>
        <button class="tab" role="tab" aria-selected="false" onclick="switchTab(5)">Recent</button>
      </div>

      <div class="card tab-panel" id="panel-0"></div>
      <div class="card tab-panel hidden" id="panel-1"></div>
      <div class="card tab-panel hidden" id="panel-2"></div>
      <div class="card tab-panel hidden" id="panel-3"></div>
      <div class="card tab-panel hidden" id="panel-4"></div>
      <div class="card tab-panel hidden" id="panel-5"></div>

    </div>
  </div>

  <script src="script.js"></script>
  
  <!-- Vercel Speed Insights -->
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
